<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>My TV Hub</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #36d399; }
    .channel {
      display: block;
      margin: 15px auto;
      padding: 16px;
      max-width: 300px;
      background: #263449;
      color: white;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>My TV Hub</h1>
  <p>Your mobile entertainment hub</p>

  <h2>Explore channels</h2>
  <a class="channel" href="https://www.youtube.com/">YouTube</a>
  <a class="channel" href="https://www.bbc.com/">BBC</a>
  <a class="channel" href="https://www.dw.com/">DW</a>

  <p>Tap a channel to visit its website.</p>
</body>
</html>
